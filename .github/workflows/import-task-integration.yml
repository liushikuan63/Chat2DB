name: Import task real dialect integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-task-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-dialects:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test integration report validation and fixture cleanup
        run: |
          python3 -B script/test/test-verify-import-it-reports.py
          python3 -B script/test/test-run-import-it-cleanup.py
          python3 -B script/test/test-import-browser-fixture.py
      - name: Test real MySQL, PostgreSQL and MariaDB fixtures and verify nonzero reports
        run: python3 script/test/run-import-it.py
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: import-task-surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: error
